name: Publish

# Publishes to npm when master carries a package.json version that npm does not
# have yet. A release is a pull request that bumps "version"; merging it
# publishes.
#
# One-time setup on npmjs.com: package okapibm25 > Settings > Trusted Publisher
#   GitHub Actions, user FurkanToprak, repository OkapiBM25,
#   workflow filename publish.yml, environment npm, "npm publish" allowed.
# npm then accepts this workflow's identity. No npm token is stored anywhere.
# Renaming this file or the environment breaks that link.
#
# The GitHub environment "npm" should allow deployments from master only
# (Settings > Environments). Without that rule, a workflow on any branch of
# this repository could publish.

on:
  push:
    branches: [master]
  # On a pull request that touches a release file, run the same checks and
  # report what a merge would publish. Nothing is published from a pull request.
  pull_request:
    paths:
      - package.json
      - .github/workflows/publish.yml
      - scripts/publish-plan.mjs
  # Starts a fresh run by hand, for a publish that failed before reaching npm.
  # If npm has the version but the GitHub release is missing, use "Re-run
  # failed jobs" on the failed run instead: a fresh run sees the version on npm
  # and stops.
  workflow_dispatch:

permissions:
  contents: read

# Runs on master never overlap. If several merges queue up, GitHub keeps only
# the newest waiting run, which is the one that carries the newest version.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Decide whether to publish
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.plan.outputs.name }}
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      # Actions are pinned to a commit so a moved tag cannot change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Compare the version in package.json with npm
        id: plan
        run: node scripts/publish-plan.mjs

  # Packs the tarball, then runs the tests. This job installs and runs the
  # development dependencies, so it gets no permission to publish.
  build:
    name: Pack and check
    needs: plan
    if: needs.plan.outputs.publish == 'true' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No dependency cache in a release build.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      # The tarball is packed and stored before the tests run. Only the
      # TypeScript compiler has run by then, so the test tools and their many
      # dependencies never get to touch what is published.
      - name: Build and pack the tarball
        run: |
          npm run build
          mkdir release
          npm pack --pack-destination release
      - name: Take the release notes from the changelog
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          PUBLISH: ${{ needs.plan.outputs.publish }}
        run: |
          awk -v version="$VERSION" '
            $1 == "##" && $2 == version { found = 1; next }
            $1 == "##" && found { exit }
            found
          ' CHANGELOG.md > release/notes.md
          if [ ! -s release/notes.md ]; then
            if [ "$PUBLISH" = "true" ]; then
              echo "::error file=CHANGELOG.md::No section starting with '## $VERSION'. Add the release notes before publishing."
              exit 1
            fi
            echo "See CHANGELOG.md." > release/notes.md
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      # A failure here fails the job, and the publish job then does not run.
      # The tests fail below 100% coverage, so the badges in the README hold.
      - name: Typecheck, tests, build and package check
        run: npm run check

  # Publishes the tarball built above. This job runs no code from the
  # repository or its dependencies, only npm, curl and the GitHub CLI.
  publish:
    name: Publish to npm
    needs: [plan, build]
    if: >-
      needs.plan.outputs.publish == 'true' &&
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/master' &&
      github.repository == 'FurkanToprak/OkapiBM25'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write # lets npm verify that this workflow is the publisher
      contents: write # creates the git tag and the GitHub release
    env:
      NAME: ${{ needs.plan.outputs.name }}
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      # Trusted publishing needs npm 11.5.1 or later. Node 24 ships with it.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      # Both steps below can be repeated, so "Re-run failed jobs" finishes a
      # release that stopped half way.
      - name: Publish, with a provenance attestation
        run: |
          npm --version
          status=$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/$NAME/$VERSION")
          if [ "$status" = "200" ]; then
            echo "$NAME@$VERSION is already on npm."
          else
            npm publish release/*.tgz --tag "$TAG"
          fi
      - name: Tag the commit and create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "The release v$VERSION already exists."
            exit 0
          fi
          flags=()
          if [ "$TAG" != "latest" ]; then flags+=(--prerelease); fi
          gh release create "v$VERSION" release/*.tgz \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --notes-file release/notes.md \
            "${flags[@]}"
