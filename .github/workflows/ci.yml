name: CI

on:
  push:
    branches: [master]
  pull_request:

# The workflow only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The test tools set this floor, not the package: Babel 8 needs
        # Node 22.18 or later. Older runtimes are covered by the old-runtimes
        # job below, which loads the build.
        node: [22, 24]
    steps:
      # Actions are pinned to a commit so a moved tag cannot change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Typecheck, including the compile-time type tests
        run: npm run typecheck
      - name: Unit, regression and property tests with 100% coverage required
        run: npm test
      - name: Build, then install the packed tarball and load it
        run: npm run test:package
      - name: Public types and exports match the committed snapshot
        run: node scripts/check-api.mjs

  # The packed package in setups other than this repository's own: old
  # TypeScript versions, bundlers, and the ES2015 syntax level of the build.
  consumers:
    name: Old TypeScript versions, bundlers, ES2015
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            compat/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Install the tools for the consumer checks
        run: npm ci --ignore-scripts
        working-directory: compat
      - run: npm run test:compat

  benchmark:
    name: Not slower than 1.4.1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # Measured at about 2x. The margin allows for noisy runners.
      - run: npm run bench -- --min-speedup 1.2

  old-runtimes:
    name: Build runs on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [12, 14, 16, 18, 20]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Load the build on an old runtime
        run: node scripts/smoke.cjs
